# Bindings for the repo-independent agent workflows (~/Development/agent-workflows).
# Steps live there and name nothing that belongs to this project; this
# file supplies every name they need. Contract + defaults:
#   ~/Development/agent-workflows/references/project-overlay.md
#
# Generated by agent-workflows/scripts/setup_repo.py.
# Edit freely — this file is the project's, not the profile's.
# Commented keys are placeholders: the conservative default applies
# until you fill them in.
# Agents: when a binding changes for this project, edit this file —
# bindings only, never steps, fill the placeholders before inventing
# keys — then validate:
#   python3 ~/Development/agent-workflows/scripts/check_overlay.py agent-overlay.yaml

schema: 1

project:
  name: shaft
  # conventions: AGENTS.md   # idioms and gotchas; unset: read the README
  codemap: docs/CODEMAP.md
  primary_checkout: read-only

forge:
  kind: github
  repo: dgrassi1984/shaft
  default_branch: main
  branch_prefixes: [claude, instance]

issues:
  approved_label: human-approved
  block_labels: [design-needed]
  claim_label: wip
  # severity_labels: [P0, P1, P2]
  never_set: [wip, milestone]

# gate:                          # unset: a workflow will ask, not invent
#   - <test command>

worktree:
  root: ../shaft-<slug>
  provision: docs/worktrees.md  # template worktree, .supervisor/

ship:
  enabled: false
  authorization: explicit
  after_merge: false
  # Contributors propose releases for maintainer review.
  versioning:
    scheme: semver
    bump: infer
    # files: []                 # unset: auto-detect
    # changelog: CHANGELOG.md   # unset: auto if present; none to skip
    tag: "v{version}"
  # procedure: docs/deploy.md   # optional; deploy/verify only

# review:
#   failure_classes: AGENTS.md   # unset: falls back to project.conventions

docs_move_with_code:
  - python3 ~/Development/agent-workflows/scripts/gen_codemap.py --root .   # without --root it regenerates agent-workflows itself
