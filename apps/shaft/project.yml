# The native chat apps (docs/plans/PLAN-native-apps.md §2.3). XcodeGen makes SHAFT.xcodeproj from this file
# (`xcodegen generate`); the project, its Info.plists and entitlements (Generated/) are git-ignored and never edited
# by hand. apps/shaft/README.md says how to build, sign and install.
name: SHAFT

options:
  bundleIdPrefix: io.github.dgrassi1984
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: <TEAM_ID>
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  SHAFTKit:
    path: Packages/SHAFTKit
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1

# The keychain group the apps and their notification extensions share: the pairing credential lives there, so an
# extension fetches the notification's body with the app's bearer (SHAFTKit KeychainStore). Each target's Info.plist
# names it as SHAFTKeychainAccessGroup. It is built from DEVELOPMENT_TEAM (the team's App ID prefix) rather than
# $(AppIdentifierPrefix), which is empty in an unsigned build, so the entitlement and the Info.plist always agree.
targetTemplates:
  SHAFTTarget:
    settings:
      base:
        SHAFT_KEYCHAIN_GROUP: $(DEVELOPMENT_TEAM).io.github.dgrassi1984.shaft

targets:
  SHAFT-iOS:
    type: application
    platform: iOS
    templates: [SHAFTTarget]
    sources:
      - path: iOS
        excludes: ["**/*.md"]
      - path: Shared
        excludes: ["**/*.md"]
    dependencies:
      - package: SHAFTKit
      - package: MarkdownUI
      - target: NotificationService-iOS
    settings:
      base:
        PRODUCT_NAME: SHAFT
        PRODUCT_BUNDLE_IDENTIFIER: io.github.dgrassi1984.shaft
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: Generated/iOS-Info.plist
      properties:
        CFBundleDisplayName: SHAFT
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SHAFTKeychainAccessGroup: $(SHAFT_KEYCHAIN_GROUP)
        UIBackgroundModes: [remote-notification]
        # shaft://chat/<instance> opens that chat, as a notification tap does (SHAFTApp.onOpenURL).
        CFBundleURLTypes:
          - CFBundleURLName: io.github.dgrassi1984.shaft
            CFBundleURLSchemes: [shaft]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    postBuildScripts:
      # Plain http to this machine (the fixture server on 127.0.0.1, apps/shaft/README.md) in Debug builds only: a
      # Release build keeps App Transport Security whole. The processed Info.plist gets NSAllowsLocalNetworking; the
      # stamp is the output the build system needs beside a file it changes in place.
      - name: Allow local http in Debug
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$plist"
          fi
          touch "$DERIVED_FILE_DIR/allow-local-http.stamp"
        inputFiles: [$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)]
        outputFiles: [$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH), $(DERIVED_FILE_DIR)/allow-local-http.stamp]
        basedOnDependencyAnalysis: false
    entitlements:
      path: Generated/iOS.entitlements
      properties:
        aps-environment: development
        keychain-access-groups: [$(SHAFT_KEYCHAIN_GROUP)]

  SHAFT-macOS:
    type: application
    platform: macOS
    templates: [SHAFTTarget]
    sources:
      - path: macOS
        excludes: ["**/*.md"]
      - path: Shared
        excludes: ["**/*.md"]
    dependencies:
      - package: SHAFTKit
      - package: MarkdownUI
      - target: NotificationService-macOS
    settings:
      base:
        PRODUCT_NAME: SHAFT
        PRODUCT_BUNDLE_IDENTIFIER: io.github.dgrassi1984.shaft
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: Generated/macOS-Info.plist
      properties:
        CFBundleDisplayName: SHAFT
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        SHAFTKeychainAccessGroup: $(SHAFT_KEYCHAIN_GROUP)
        # shaft://chat/<instance> opens that chat, as a notification click does (MacRoot.onOpenURL).
        CFBundleURLTypes:
          - CFBundleURLName: io.github.dgrassi1984.shaft
            CFBundleURLSchemes: [shaft]
    postBuildScripts:
      # As for iOS: plain http to this machine (the fixture server) in Debug builds only.
      - name: Allow local http in Debug
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$plist"
          fi
          touch "$DERIVED_FILE_DIR/allow-local-http.stamp"
        inputFiles: [$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)]
        outputFiles: [$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH), $(DERIVED_FILE_DIR)/allow-local-http.stamp]
        basedOnDependencyAnalysis: false
    entitlements:
      path: Generated/macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.developer.aps-environment: development
        keychain-access-groups: [$(SHAFT_KEYCHAIN_GROUP)]

  # The Mac app's own logic that needs no window: its Markdown text and its text views' menu items. A plain test
  # bundle with no host app, run by the SHAFT-macOS scheme's test action.
  SHAFTMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: macOSTests
      - path: macOS/MarkdownAttributed.swift
      - path: macOS/MenuAction.swift
    dependencies:
      - package: SHAFTKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.dgrassi1984.shaft.MacTests
        GENERATE_INFOPLIST_FILE: YES

  NotificationService-iOS:
    type: app-extension
    platform: iOS
    templates: [SHAFTTarget]
    sources:
      - path: NotificationService
        excludes: ["**/*.md"]
    dependencies:
      - package: SHAFTKit
    settings:
      base:
        PRODUCT_NAME: NotificationService
        PRODUCT_BUNDLE_IDENTIFIER: io.github.dgrassi1984.shaft.NotificationService
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Generated/NotificationService-iOS-Info.plist
      properties:
        CFBundleDisplayName: SHAFT Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SHAFTKeychainAccessGroup: $(SHAFT_KEYCHAIN_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: Generated/NotificationService-iOS.entitlements
      properties:
        keychain-access-groups: [$(SHAFT_KEYCHAIN_GROUP)]

  NotificationService-macOS:
    type: app-extension
    platform: macOS
    templates: [SHAFTTarget]
    sources:
      - path: NotificationService
        excludes: ["**/*.md"]
    dependencies:
      - package: SHAFTKit
    settings:
      base:
        PRODUCT_NAME: NotificationService
        PRODUCT_BUNDLE_IDENTIFIER: io.github.dgrassi1984.shaft.NotificationService
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Generated/NotificationService-macOS-Info.plist
      properties:
        CFBundleDisplayName: SHAFT Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SHAFTKeychainAccessGroup: $(SHAFT_KEYCHAIN_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: Generated/NotificationService-macOS.entitlements
      properties:
        # App extensions on macOS must run sandboxed.
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        keychain-access-groups: [$(SHAFT_KEYCHAIN_GROUP)]

schemes:
  SHAFT-iOS:
    build:
      targets:
        SHAFT-iOS: all
    run:
      config: Debug
  SHAFT-macOS:
    build:
      targets:
        SHAFT-macOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [SHAFTMacTests]
