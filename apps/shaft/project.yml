# The native chat apps. XcodeGen makes SHAFT.xcodeproj from this file
# (`xcodegen generate`); the project, its Info.plists and entitlements (Generated/) are git-ignored and never edited
# by hand. apps/shaft/README.md says how to build, sign and install.
name: SHAFT

# Create this gitignored file from the example in README.md before generation.
include: Signing.local.yml

options:
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  SHAFTKit:
    path: Packages/SHAFTKit
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
  # The Mac app's self-update (macOS/AppUpdates.swift). A binary xcframework; its bin/ tools (generate_keys,
  # sign_update) land in DerivedData's SourcePackages/artifacts/sparkle/Sparkle/bin/, where release-mac.sh uses them.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

# The keychain group the apps and their notification extensions share: the pairing credential lives there, so an
# extension fetches the notification's body with the app's bearer (SHAFTKit KeychainStore). Each target's Info.plist
# names it as SHAFTKeychainAccessGroup. It is built from DEVELOPMENT_TEAM (the team's App ID prefix) rather than
# $(AppIdentifierPrefix), which is empty in an unsigned build, so the entitlement and the Info.plist always agree.
targetTemplates:
  SHAFTTarget:
    settings:
      base:
        # Version stamping reads git metadata, including the main repo of a linked worktree.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SHAFT_KEYCHAIN_GROUP: $(DEVELOPMENT_TEAM).$(SHAFT_BUNDLE_PREFIX).shaft

targets:
  SHAFT-iOS:
    type: application
    platform: iOS
    templates: [SHAFTTarget]
    sources:
      - path: iOS
        excludes: ["**/*.md"]
      - path: Shared
        excludes: ["**/*.md", "**/*.py"]
    dependencies:
      - package: SHAFTKit
      - package: MarkdownUI
      - target: NotificationService-iOS
      - target: ShareExtension-iOS
      # The Apple Watch app, embedded so it installs with the iPhone app.
      - target: SHAFT-watchOS
    settings:
      base:
        PRODUCT_NAME: SHAFT
        PRODUCT_BUNDLE_IDENTIFIER: $(SHAFT_BUNDLE_PREFIX).shaft
        TARGETED_DEVICE_FAMILY: "1,2"
        # Everyday builds use development push; release-ios.sh overrides this for the App Store archive.
        SHAFT_APS_ENVIRONMENT: development
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Generated/iOS-Info.plist
      properties:
        # HTTPS and Keychain use only the operating system's exempt encryption.
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: SHAFT
        SHAFTKeychainAccessGroup: $(SHAFT_KEYCHAIN_GROUP)
        # audio: a voice session goes on with the iPhone locked or the app in the background.
        UIBackgroundModes: [remote-notification, audio]
        # Voice mode: asked when voice mode first opens.
        NSMicrophoneUsageDescription: >-
          SHAFT listens while voice mode is open, so you can talk with an instance. The audio stays on this iPhone:
          only the transcript of what you say is sent, as your message.
        NSSpeechRecognitionUsageDescription: >-
          SHAFT turns what you say into text on this iPhone while voice mode is open. The audio stays on the device:
          only the transcript is sent, as your message.
        # shaft://chat/<instance> opens that chat, as a notification tap does (SHAFTApp.onOpenURL).
        CFBundleURLTypes:
          - CFBundleURLName: $(SHAFT_BUNDLE_PREFIX).shaft
            CFBundleURLSchemes: [shaft]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    postBuildScripts:
      # Plain http to this machine (the fixture server on 127.0.0.1, apps/shaft/README.md) in Debug builds only: a
      # Release build keeps App Transport Security whole. The processed Info.plist gets NSAllowsLocalNetworking; the
      # stamp is the output the build system needs beside a file it changes in place.
      - name: Allow local http in Debug
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$plist"
          fi
          touch "$DERIVED_FILE_DIR/allow-local-http.stamp"
        inputFiles: [$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)]
        outputFiles: [$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH), $(DERIVED_FILE_DIR)/allow-local-http.stamp]
        basedOnDependencyAnalysis: false
      - name: Stamp git version
        script: '"$SRCROOT/Scripts/stamp-version.sh"'
        inputFiles: [$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)]
        outputFiles: [$(DERIVED_FILE_DIR)/stamp-version.stamp]
        basedOnDependencyAnalysis: false
    entitlements:
      path: Generated/iOS.entitlements
      properties:
        aps-environment: $(SHAFT_APS_ENVIRONMENT)
        keychain-access-groups: [$(SHAFT_KEYCHAIN_GROUP)]

  SHAFT-macOS:
    type: application
    platform: macOS
    templates: [SHAFTTarget]
    sources:
      - path: macOS
        excludes: ["**/*.md"]
      - path: Shared
        excludes: ["**/*.md", "**/*.py"]
    dependencies:
      - package: SHAFTKit
      - package: MarkdownUI
      - package: Sparkle
      - target: NotificationService-macOS
    settings:
      base:
        PRODUCT_NAME: SHAFT
        PRODUCT_BUNDLE_IDENTIFIER: $(SHAFT_BUNDLE_PREFIX).shaft
        ENABLE_HARDENED_RUNTIME: YES
        # Self-update (macOS/AppUpdates.swift). The feed is empty in every build but the Developer ID one:
        # Scripts/release-mac.sh passes SHAFT_UPDATE_FEED for its archive, and the "Drop an empty update feed" step
        # below removes the key otherwise, so an everyday build never offers itself the official download. The key is
        # the public half of the EdDSA pair whose private half signs each release (README.md "Release a signed
        # build"); release-mac.sh refuses to sign with any other.
        SHAFT_UPDATE_FEED: ""
        SHAFT_UPDATE_KEY: UL5pMxmGBWOti6qcS1cTtSEHib522ioxVhuK7wJ7TjE=
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The APNs environment the entitlement below names. Everyday builds, Release included, are signed with an
        # Apple Development identity, which only fits a development profile; Scripts/release-mac.sh overrides it with
        # SHAFT_APS_ENVIRONMENT=production for the Developer ID archive and checks the signed result.
        SHAFT_APS_ENVIRONMENT: development
    info:
      path: Generated/macOS-Info.plist
      properties:
        CFBundleDisplayName: SHAFT
        LSApplicationCategoryType: public.app-category.productivity
        SHAFTKeychainAccessGroup: $(SHAFT_KEYCHAIN_GROUP)
        # Voice mode: asked when voice mode first opens.
        NSMicrophoneUsageDescription: >-
          SHAFT listens while voice mode is open, so you can talk with an instance. The audio stays on this Mac: only
          the transcript of what you say is sent, as your message.
        NSSpeechRecognitionUsageDescription: >-
          SHAFT turns what you say into text on this Mac while voice mode is open. The audio stays on the device: only
          the transcript is sent, as your message.
        # shaft://chat/<instance> opens that chat, as a notification click does (MacRoot.onOpenURL).
        CFBundleURLTypes:
          - CFBundleURLName: $(SHAFT_BUNDLE_PREFIX).shaft
            CFBundleURLSchemes: [shaft]
        # Sparkle: checked once a day without asking first (an explicit SUEnableAutomaticChecks skips its prompt),
        # installed only when the user says so, no system profile sent. The archive's EdDSA signature is checked
        # before the DMG is even mounted, and the feed itself must be signed (both need the key above).
        SUFeedURL: $(SHAFT_UPDATE_FEED)
        SUPublicEDKey: $(SHAFT_UPDATE_KEY)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
        SUEnableSystemProfiling: false
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
    postBuildScripts:
      # No feed, no key: Sparkle reads an empty SUFeedURL as a feed. AppUpdates also refuses to start without one.
      - name: Drop an empty update feed
        script: |
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          feed=$(/usr/libexec/PlistBuddy -c "Print :SUFeedURL" "$plist" 2>/dev/null || true)
          if [ -z "$feed" ]; then
            /usr/libexec/PlistBuddy -c "Delete :SUFeedURL" "$plist" 2>/dev/null || true
          fi
          touch "$DERIVED_FILE_DIR/drop-empty-feed.stamp"
        inputFiles: [$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)]
        outputFiles: [$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH), $(DERIVED_FILE_DIR)/drop-empty-feed.stamp]
        basedOnDependencyAnalysis: false
      # Plain http to this machine in every configuration: the Mac app's setup wizard talks to the server it starts on
      # 127.0.0.1 (and the fixture server in Debug). iOS stays Debug-only above.
      - name: Allow local http
        script: |
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$plist"
          touch "$DERIVED_FILE_DIR/allow-local-http.stamp"
        inputFiles: [$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)]
        outputFiles: [$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH), $(DERIVED_FILE_DIR)/allow-local-http.stamp]
        basedOnDependencyAnalysis: false
      - name: Stamp git version
        script: '"$SRCROOT/Scripts/stamp-version.sh"'
        inputFiles: [$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)]
        outputFiles: [$(DERIVED_FILE_DIR)/stamp-version.stamp]
        basedOnDependencyAnalysis: false
    entitlements:
      path: Generated/macOS.entitlements
      properties:
        # No App Sandbox: the setup wizard runs git, uv and the server's CLI and writes ~/SHAFT. The hardened runtime
        # stays on (ENABLE_HARDENED_RUNTIME); NotificationService-macOS keeps its sandbox (extensions must).
        # The microphone for voice mode, under the hardened runtime.
        com.apple.security.device.audio-input: true
        com.apple.developer.aps-environment: $(SHAFT_APS_ENVIRONMENT)
        keychain-access-groups: [$(SHAFT_KEYCHAIN_GROUP)]

  # The Mac app's own logic that needs no window: its Markdown text, its text views' menu items, the setup gate and the
  # setup wizard's rules and work. A plain test bundle with no host app, run by the SHAFT-macOS scheme's test action.
  SHAFTMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: macOSTests
      - path: macOS/MacTextViews.swift
      - path: Shared/Platform/TextViews.swift
      - path: Shared/Attachments/ItemImport.swift
      - path: Shared/Design/Design.swift
      - path: Shared/Design/Appearance.swift
      - path: Shared/Markdown/RenderedText.swift
      - path: Shared/Markdown/TableColumns.swift
      - path: Shared/Documents/CommentHighlight.swift
      - path: Shared/Documents/DocumentSaver.swift
      - path: Shared/Documents/DocumentStatus.swift
      - path: macOS/MarkdownAttributed.swift
      - path: macOS/SelectionReplyButton.swift
      - path: macOS/MenuAction.swift
      - path: macOS/MacDevSession.swift
      - path: macOS/UpdateFeed.swift
      - path: macOS/Setup/SetupGate.swift
      - path: macOS/Setup/MacSetup.swift
      - path: macOS/Setup/SetupForms.swift
      - path: macOS/Setup/SetupSteps.swift
      - path: macOS/Setup/GoogleSetup.swift
      - path: Shared/Attachments/AttachmentViews.swift
    dependencies:
      - package: SHAFTKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SHAFT_BUNDLE_PREFIX).shaft.MacTests
        GENERATE_INFOPLIST_FILE: YES

  # The App Store screenshots: drives the iOS app's built-in demo and writes each screen as a PNG
  # (ScreenshotTests/StoreScreenshots.swift; AppStore/README.md says how to run it per device).
  SHAFTScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ScreenshotTests
    dependencies:
      - target: SHAFT-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SHAFT_BUNDLE_PREFIX).shaft.Screenshots
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: SHAFT-iOS

  ShareExtension-iOS:
    type: app-extension
    platform: iOS
    templates: [SHAFTTarget]
    sources:
      - path: ShareExtension
        excludes: ["**/*.md"]
    dependencies:
      - package: SHAFTKit
    settings:
      base:
        PRODUCT_NAME: ShareExtension
        PRODUCT_BUNDLE_IDENTIFIER: $(SHAFT_BUNDLE_PREFIX).shaft.ShareExtension
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Generated/ShareExtension-iOS-Info.plist
      properties:
        CFBundleDisplayName: SHAFT
        SHAFTKeychainAccessGroup: $(SHAFT_KEYCHAIN_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 5
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 3
              NSExtensionActivationSupportsFileWithMaxCount: 10
    postBuildScripts:
      - name: Allow local http in Debug
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$plist"
          fi
          touch "$DERIVED_FILE_DIR/allow-local-http.stamp"
        inputFiles: [$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)]
        outputFiles: [$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH), $(DERIVED_FILE_DIR)/allow-local-http.stamp]
        basedOnDependencyAnalysis: false
      - name: Stamp git version
        script: '"$SRCROOT/Scripts/stamp-version.sh"'
        inputFiles: [$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)]
        outputFiles: [$(DERIVED_FILE_DIR)/stamp-version.stamp]
        basedOnDependencyAnalysis: false
    entitlements:
      path: Generated/ShareExtension-iOS.entitlements
      properties:
        keychain-access-groups: [$(SHAFT_KEYCHAIN_GROUP)]

  NotificationService-iOS:
    type: app-extension
    platform: iOS
    templates: [SHAFTTarget]
    sources:
      - path: NotificationService
        excludes: ["**/*.md"]
    dependencies:
      - package: SHAFTKit
    settings:
      base:
        PRODUCT_NAME: NotificationService
        PRODUCT_BUNDLE_IDENTIFIER: $(SHAFT_BUNDLE_PREFIX).shaft.NotificationService
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Generated/NotificationService-iOS-Info.plist
      properties:
        CFBundleDisplayName: SHAFT Notifications
        SHAFTKeychainAccessGroup: $(SHAFT_KEYCHAIN_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    postBuildScripts:
      - name: Stamp git version
        script: '"$SRCROOT/Scripts/stamp-version.sh"'
        inputFiles: [$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)]
        outputFiles: [$(DERIVED_FILE_DIR)/stamp-version.stamp]
        basedOnDependencyAnalysis: false
    entitlements:
      path: Generated/NotificationService-iOS.entitlements
      properties:
        keychain-access-groups: [$(SHAFT_KEYCHAIN_GROUP)]

  # The Apple Watch app: talk to an instance from the wrist. watchOS runs no VPN, so the watch can't reach the server
  # on the tailnet: it holds no credential and asks the iPhone app (iOS/WatchRelay.swift) over WatchConnectivity.
  # The message types are SHAFTKit's WatchProtocol.swift, compiled in as a file (SHAFTKit itself is not built for
  # watchOS). Its version is stamped as the iPhone app's: iOS refuses a companion watch app whose version differs.
  SHAFT-watchOS:
    type: application
    platform: watchOS
    templates: [SHAFTTarget]
    sources:
      - path: watchOS
        excludes: ["**/*.md"]
      - path: Packages/SHAFTKit/Sources/SHAFTKit/Watch/WatchProtocol.swift
      # The shared catalog's AppIcon has a watchOS image (watch-1024.png, opaque): App Store Connect refuses an upload
      # whose watch app names no CFBundleIconName.
      - path: Shared/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: SHAFT
        PRODUCT_BUNDLE_IDENTIFIER: $(SHAFT_BUNDLE_PREFIX).shaft.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated/watchOS-Info.plist
      properties:
        # HTTPS and Keychain use only the operating system's exempt encryption.
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: SHAFT
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(SHAFT_BUNDLE_PREFIX).shaft
    postBuildScripts:
      - name: Stamp git version
        script: '"$SRCROOT/Scripts/stamp-version.sh"'
        inputFiles: [$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)]
        outputFiles: [$(DERIVED_FILE_DIR)/stamp-version.stamp]
        basedOnDependencyAnalysis: false

  NotificationService-macOS:
    type: app-extension
    platform: macOS
    templates: [SHAFTTarget]
    sources:
      - path: NotificationService
        excludes: ["**/*.md"]
    dependencies:
      - package: SHAFTKit
    settings:
      base:
        PRODUCT_NAME: NotificationService
        PRODUCT_BUNDLE_IDENTIFIER: $(SHAFT_BUNDLE_PREFIX).shaft.NotificationService
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Generated/NotificationService-macOS-Info.plist
      properties:
        CFBundleDisplayName: SHAFT Notifications
        SHAFTKeychainAccessGroup: $(SHAFT_KEYCHAIN_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    postBuildScripts:
      - name: Stamp git version
        script: '"$SRCROOT/Scripts/stamp-version.sh"'
        inputFiles: [$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)]
        outputFiles: [$(DERIVED_FILE_DIR)/stamp-version.stamp]
        basedOnDependencyAnalysis: false
    entitlements:
      path: Generated/NotificationService-macOS.entitlements
      properties:
        # App extensions on macOS must run sandboxed.
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        keychain-access-groups: [$(SHAFT_KEYCHAIN_GROUP)]

schemes:
  SHAFT-iOS:
    build:
      targets:
        SHAFT-iOS: all
    run:
      config: Debug
  SHAFT-macOS:
    build:
      targets:
        SHAFT-macOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [SHAFTMacTests]
  SHAFT-Screenshots:
    build:
      targets:
        SHAFT-iOS: all
    test:
      config: Debug
      targets: [SHAFTScreenshots]
